name: Build and test Python package

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  linting:
    name: Linting
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
    uses: greenbone/workflows/.github/workflows/lint-python.yml@main
    with:
      lint-packages: mattermost_notify tests
      linter: ruff check
      python-version: ${{ matrix.python-version }}

  test:
    name: Run tests
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
    uses: greenbone/workflows/.github/workflows/test-python.yml@main
    with:
      python-version: ${{ matrix.python-version }}

  mypy:
    name: Check types
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
    uses: greenbone/workflows/.github/workflows/typing-python.yml@main
    with:
      python-version: ${{ matrix.python-version }}

  codecov:
    name: Upload coverage to codecov.io
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Calculate and upload coverage to codecov.io
        uses: greenbone/actions/coverage-python@v3
        with:
          python-version: "3.11"
          token: ${{ secrets.CODECOV_TOKEN }}

  check-version:
    name: Check versioning for consistency
    uses: greenbone/workflows/.github/workflows/check-version.yml@main

  all-python-ci-jobs-passed:
    name: All Python CI jobs passed
    needs: [linting, test, mypy, codecov, check-version]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<<"$NEEDS"
